<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#f9f9f9",
                        "primary-fixed": "#e5e2e1",
                        "tertiary": "#000000",
                        "on-secondary-fixed": "#1b1c1c",
                        "on-tertiary-container": "#868382",
                        "surface": "#f9f9f9",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-tertiary-fixed": "#1c1b1a",
                        "on-primary-container": "#858383",
                        "inverse-surface": "#2f3131",
                        "on-primary-fixed": "#1c1b1b",
                        "surface-tint": "#5f5e5e",
                        "error": "#ba1a1a",
                        "tertiary-container": "#1c1b1a",
                        "secondary-container": "#e3e2e2",
                        "on-background": "#1a1c1c",
                        "background": "#f9f9f9",
                        "tertiary-fixed-dim": "#cac6c4",
                        "surface-container-low": "#f3f3f3",
                        "inverse-primary": "#c8c6c5",
                        "on-secondary-container": "#646464",
                        "on-primary": "#ffffff",
                        "secondary": "#5e5e5e",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#444748",
                        "error-container": "#ffdad6",
                        "primary-container": "#1c1b1b",
                        "on-surface": "#1a1c1c",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#e3e2e2",
                        "surface-container-high": "#e8e8e8",
                        "on-error-container": "#93000a",
                        "primary": "#000000",
                        "outline": "#747878",
                        "on-primary-fixed-variant": "#474746",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-fixed-variant": "#464747",
                        "outline-variant": "#c4c7c7",
                        "surface-variant": "#e2e2e2",
                        "surface-container": "#eeeeee",
                        "inverse-on-surface": "#f1f1f1",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-tertiary-fixed-variant": "#484645",
                        "tertiary-fixed": "#e6e2df",
                        "surface-dim": "#dadada"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "40px",
                        "sm": "8px",
                        "xs": "4px",
                        "md": "16px",
                        "safe-area-inset": "16px",
                        "base": "4px",
                        "lg": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Manrope"],
                        "numeric-display": ["Manrope"],
                        "label-sm": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "body-md": ["Manrope"],
                        "label-md": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "numeric-display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body-md text-on-background selection:bg-secondary-container">
<!-- Top App Bar (Task-Focused: Suppressed Global Nav) -->
<header class="flex justify-between items-center w-full px-4 h-16 bg-white border-b border-neutral-100 sticky top-0 z-50">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:scale-95 transition-transform hover:bg-neutral-50">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Add Transaction</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="max-w-md mx-auto pb-lg">
<!-- Display Area -->
<section class="px-md pt-lg pb-md flex flex-col items-center justify-center space-y-2">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Amount</span>
<div class="flex items-baseline space-x-1">
<span class="font-numeric-display text-headline-md text-on-surface-variant">$</span>
<span class="font-numeric-display text-numeric-display text-primary">0.00</span>
</div>
<div class="inline-flex items-center space-x-2 px-3 py-1 bg-surface-container-low rounded-full">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">calendar_today</span>
<span class="font-label-sm text-label-sm text-on-surface">Today, Oct 24</span>
</div>
</section>
<!-- Quick Select Categories (Horizontal Scroll) -->
<section class="py-md overflow-x-auto no-scrollbar">
<div class="flex space-x-4 px-md">
<!-- Category Item -->
<button class="flex flex-col items-center space-y-2 shrink-0 group active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Food</span>
</button>
<button class="flex flex-col items-center space-y-2 shrink-0 group active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="directions_car">directions_car</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Transport</span>
</button>
<button class="flex flex-col items-center space-y-2 shrink-0 group active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="home">home</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Rent</span>
</button>
<button class="flex flex-col items-center space-y-2 shrink-0 group active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Shopping</span>
</button>
<button class="flex flex-col items-center space-y-2 shrink-0 group active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">More</span>
</button>
</div>
</section>
<!-- Optional Note Field -->
<section class="px-md pb-md">
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none rounded-xl px-md py-4 font-body-md focus:ring-1 focus:ring-primary-container focus:bg-white transition-all placeholder:text-on-surface-variant/50" placeholder="Add a note (optional)" type="text"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/40">edit</span>
</div>
</section>
<!-- Numeric Keypad (Optimized for Thumb Zone) -->
<section class="px-md pt-sm">
<div class="grid grid-cols-3 gap-2">
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-headline-sm font-numeric-display">1</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-headline-sm font-numeric-display">2</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-headline-sm font-numeric-display">3</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-headline-sm font-numeric-display">4</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-headline-sm font-numeric-display">5</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-headline-sm font-numeric-display">6</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-headline-sm font-numeric-display">7</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-headline-sm font-numeric-display">8</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-headline-sm font-numeric-display">9</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-bright border border-surface-container active:scale-95 transition-all text-headline-sm font-numeric-display">.</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-headline-sm font-numeric-display">0</button>
<button class="h-16 flex items-center justify-center rounded-xl bg-surface-bright border border-surface-container active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-surface">backspace</span>
</button>
</div>
</section>
<!-- Save Button (Large, Primary, Reachable) -->
<section class="px-md pt-lg">
<button class="w-full h-16 bg-primary text-on-primary rounded-xl font-headline-sm flex items-center justify-center shadow-lg active:scale-[0.98] transition-transform">
                Save Transaction
            </button>
</section>
<!-- Recent History / Insights (Bento Preview) -->
<section class="px-md pt-xl space-y-md">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Quick Insights</h2>
<div class="grid grid-cols-2 gap-4">
<div class="col-span-2 p-md bg-surface-container-low rounded-xl flex items-center justify-between border border-surface-container">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Remaining Budget</p>
<p class="font-headline-sm text-headline-sm text-primary">$1,240.50</p>
</div>
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-white">
<span class="material-symbols-outlined text-primary" data-icon="pie_chart">pie_chart</span>
</div>
</div>
<div class="p-md bg-secondary-container/30 rounded-xl space-y-2 border border-secondary-container/50">
<span class="material-symbols-outlined text-secondary" data-icon="trending_up">trending_up</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">Daily Average</p>
<p class="font-headline-sm text-headline-sm text-on-surface">$42.00</p>
</div>
<div class="p-md bg-tertiary-fixed rounded-xl space-y-2 border border-tertiary-fixed-dim/30">
<span class="material-symbols-outlined text-on-tertiary-fixed" data-icon="account_balance_wallet">account_balance_wallet</span>
<p class="font-label-sm text-label-sm text-on-tertiary-fixed-variant">Primary Acct</p>
<p class="font-headline-sm text-headline-sm text-on-tertiary-fixed">$4,821</p>
</div>
</div>
</section>
</main>
<!-- Contextual FAB (Hidden on this screen as it's a sub-page with a primary action) -->
<!-- Image placeholder for visual rhythm (Bento card style) -->
<div class="px-md pt-lg pb-xl">
<div class="w-full h-48 rounded-xl overflow-hidden relative grayscale opacity-80 border border-surface-container">
<img class="w-full h-full object-cover" data-alt="A macro photograph of high-end, matte black stationary items and a sleek modern calculator resting on a pure white, marble-topped desk. The lighting is diffused and soft, creating a serene and professional financial atmosphere. The composition is minimal and clean, reflecting a state of calm financial control and mindfulness. The aesthetic is strictly modern light-mode with subtle gray tonal shifts." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBn93TQIkFOAiShk-O_efMHOFbSGgOD9vIFqB-VE9c58jfBoh2gywKAhhcp0J49jopE-ys5WAT420k60w8ut5GpCg9vwqdYyUXEkVIvw0I8PxXhoXHs62L-jYYjv3UIe1_eG1pB2cC_tSIvgG_eRbgOQ1E1S9uC235h7DLBMVUQVDwEnI9uHV1qI4K9YJGYCxOVHulynOCTnh7_35q571pJgJZpmQNLDEAE9XpgKZALfvdRM5zpQACJO4pHaqncg4G4jqazDdYxCw"/>
<div class="absolute inset-0 bg-gradient-to-t from-background/80 to-transparent"></div>
<div class="absolute bottom-4 left-4">
<p class="font-label-md text-label-md text-primary">Master your flow</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">You've logged 12 days in a row</p>
</div>
</div>
</div>
</body></html>
